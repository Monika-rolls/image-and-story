<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
  <title id="t">Position-first retrieval versus ordinary search, ten minutes into the chapter</title>
  <desc id="d">A 17 minute 26 second chapter on a timeline. The listener is at 10:00 and asks "what did that mean?". Ordinary vector search returns passages at 02:23, 13:58, 14:52 and 16:03, three of them ahead of the listener. Hark reads the window from 08:30 to 10:15 and returns 08:23, 09:20 and 10:12.</desc>
  <rect width="1280" height="520" rx="18" fill="#f7f6f2"/>
  <g font-family="Geist,'Segoe UI',Arial,sans-serif" fill="#1f1d1a">
    <text x="80" y="62" font-size="24" font-weight="500">“Wait, what did that mean?”, asked at 10:00 of Calculus Made Easy, ch. 3</text>

    <!-- not heard yet -->
    <rect x="722" y="110" width="478" height="330" fill="#ece9e1"/>
    <text x="961" y="138" font-size="16" fill="#77716a" text-anchor="middle">not heard yet: off limits</text>

    <!-- window -->
    <rect x="626" y="110" width="112" height="330" fill="#bf4a17" fill-opacity="0.12"/>

    <!-- playhead -->
    <line x1="722" y1="96" x2="722" y2="456" stroke="#bf4a17" stroke-width="3"/>
    <text x="722" y="88" font-size="17" fill="#bf4a17" text-anchor="middle" font-family="'Geist Mono',Consolas,monospace">playhead 10:00</text>

    <!-- row 1: ordinary search -->
    <text x="80" y="200" font-size="19" font-weight="500">Ordinary search</text>
    <text x="80" y="224" font-size="15" fill="#5f5a54">embeds the question, which names no topic</text>
    <line x1="80" y1="260" x2="1200" y2="260" stroke="#c9c4ba" stroke-width="2"/>
    <g font-family="'Geist Mono',Consolas,monospace" font-size="15" text-anchor="middle">
      <circle cx="233" cy="260" r="9" fill="#77716a"/><text x="233" y="290" fill="#5f5a54">02:23</text>
      <circle cx="977" cy="260" r="9" fill="#77716a"/><text x="977" y="290" fill="#5f5a54">13:58</text>
      <circle cx="1035" cy="260" r="9" fill="#77716a"/><text x="1035" y="290" fill="#5f5a54">14:52</text>
      <circle cx="1111" cy="260" r="9" fill="#77716a"/><text x="1111" y="290" fill="#5f5a54">16:03</text>
    </g>

    <!-- row 2: Hark -->
    <text x="80" y="350" font-size="19" font-weight="500">Hark</text>
    <text x="80" y="374" font-size="15" fill="#5f5a54">reads 90 s back, 15 s ahead</text>
    <line x1="80" y1="400" x2="1200" y2="400" stroke="#c9c4ba" stroke-width="2"/>
    <g font-family="'Geist Mono',Consolas,monospace" font-size="15" text-anchor="middle">
      <circle cx="619" cy="400" r="9" fill="#bf4a17"/><text x="600" y="430" fill="#1f1d1a">08:23</text>
      <circle cx="680" cy="400" r="9" fill="#bf4a17"/><text x="672" y="430" fill="#1f1d1a">09:20</text>
      <circle cx="735" cy="400" r="9" fill="#bf4a17"/><text x="752" y="430" fill="#1f1d1a">10:12</text>
    </g>

    <!-- axis -->
    <g font-family="'Geist Mono',Consolas,monospace" font-size="14" fill="#77716a">
      <text x="80" y="480">00:00</text>
      <text x="1200" y="480" text-anchor="end">17:26</text>
    </g>
  </g>
</svg>
