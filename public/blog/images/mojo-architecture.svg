<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">How Mojo is wired after adding Mirage and web search</title>
  <desc id="d">Microphone to Cactus Whistle (speech to text), then a router that sends each request to phone actions (Needle 3 and rules), camera plus Cactus Mirage, web search plus Qwen, or Qwen alone from memory. Every branch ends in the Underdog Woof voice. Only web search needs the internet.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a29fb8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e04fae"/>
    </marker>
  </defs>
  <rect width="1280" height="640" rx="18" fill="#0f0e1a"/>
  <g font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" fill="#eeedf5">

    <!-- input -->
    <rect x="30" y="268" width="150" height="104" rx="14" fill="#1c1a2e" stroke="#9a5af2" stroke-width="2"/>
    <text x="105" y="312" font-size="24" font-weight="700" text-anchor="middle">You</text>
    <text x="105" y="342" font-size="18" fill="#a29fb8" text-anchor="middle">“Hey Mojo, …”</text>

    <rect x="220" y="258" width="200" height="124" rx="14" fill="#1c1a2e" stroke="#9a5af2" stroke-width="2"/>
    <text x="320" y="302" font-size="24" font-weight="700" text-anchor="middle">Whistle</text>
    <text x="320" y="332" font-size="18" fill="#a29fb8" text-anchor="middle">speech → text</text>
    <text x="320" y="358" font-size="16" fill="#a29fb8" text-anchor="middle">Cactus</text>

    <rect x="448" y="228" width="248" height="184" rx="14" fill="#1c1a2e" stroke="#9a5af2" stroke-width="2"/>
    <text x="572" y="268" font-size="24" font-weight="700" text-anchor="middle">Router</text>
    <text x="466" y="300" font-size="16" fill="#a29fb8">1. “what do you see?” “read this”</text>
    <text x="466" y="326" font-size="16" fill="#a29fb8">2. “search for…” “look up…”</text>
    <text x="466" y="352" font-size="16" fill="#a29fb8">3. rules → Needle 3</text>
    <text x="466" y="378" font-size="16" fill="#a29fb8">4. otherwise: a question</text>

    <path d="M180 320 H214" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M420 320 H442" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>

    <!-- branches -->
    <rect x="740" y="30" width="290" height="112" rx="14" fill="#1c1a2e" stroke="#9a5af2" stroke-width="2"/>
    <text x="760" y="72" font-size="22" font-weight="700">Phone actions</text>
    <text x="760" y="100" font-size="17" fill="#a29fb8">Needle 3 + rules</text>
    <text x="760" y="124" font-size="17" fill="#a29fb8">flashlight, volume, alarm, Wi-Fi…</text>

    <rect x="740" y="172" width="290" height="112" rx="14" fill="#1c1a2e" stroke="#9a5af2" stroke-width="3"/>
    <text x="760" y="214" font-size="22" font-weight="700">Camera → Mirage</text>
    <rect x="952" y="159" width="62" height="26" rx="13" fill="#9a5af2"/>
    <text x="983" y="178" font-size="15" font-weight="700" fill="#0f0e1a" text-anchor="middle">NEW</text>
    <text x="760" y="242" font-size="17" fill="#a29fb8">describe the scene · read text</text>
    <text x="760" y="266" font-size="17" fill="#a29fb8">photo never leaves the phone</text>

    <rect x="740" y="314" width="290" height="112" rx="14" fill="#1c1a2e" stroke="#e04fae" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="760" y="356" font-size="22" font-weight="700">Web search → Qwen</text>
    <rect x="952" y="301" width="62" height="26" rx="13" fill="#e04fae"/>
    <text x="983" y="320" font-size="15" font-weight="700" fill="#0f0e1a" text-anchor="middle">NEW</text>
    <text x="760" y="384" font-size="17" fill="#a29fb8">DuckDuckGo · Wikipedia · wttr.in</text>
    <text x="760" y="408" font-size="17" fill="#a29fb8">only when online, no API keys</text>

    <rect x="740" y="456" width="290" height="112" rx="14" fill="#1c1a2e" stroke="#9a5af2" stroke-width="2"/>
    <text x="760" y="498" font-size="22" font-weight="700">Qwen3-0.6B</text>
    <text x="760" y="526" font-size="17" fill="#a29fb8">answers from memory</text>
    <text x="760" y="550" font-size="17" fill="#a29fb8">(llama.cpp, offline)</text>

    <path d="M696 300 C718 300 712 86 734 86" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M696 312 C718 312 712 228 734 228" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M696 328 C718 328 712 370 734 370" stroke="#e04fae" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ap)"/>
    <path d="M696 340 C718 340 712 512 734 512" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>

    <!-- output -->
    <rect x="1090" y="258" width="164" height="124" rx="14" fill="#1c1a2e" stroke="#9a5af2" stroke-width="2"/>
    <text x="1172" y="302" font-size="24" font-weight="700" text-anchor="middle">Woof</text>
    <text x="1172" y="332" font-size="18" fill="#a29fb8" text-anchor="middle">“Juno” voice</text>
    <text x="1172" y="358" font-size="16" fill="#a29fb8" text-anchor="middle">spoken reply</text>

    <path d="M1030 86 C1062 86 1058 296 1084 300" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M1030 228 C1060 228 1058 312 1084 312" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M1030 370 C1060 370 1058 328 1084 328" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M1030 512 C1062 512 1058 344 1084 340" stroke="#a29fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>

    <!-- legend -->
    <rect x="30" y="590" width="34" height="18" rx="4" fill="#1c1a2e" stroke="#9a5af2" stroke-width="2"/>
    <text x="74" y="605" font-size="17" fill="#a29fb8">runs on the phone</text>
    <rect x="250" y="590" width="34" height="18" rx="4" fill="#1c1a2e" stroke="#e04fae" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="294" y="605" font-size="17" fill="#a29fb8">needs the internet (dashed)</text>
    <text x="1250" y="605" font-size="16" fill="#a29fb8" text-anchor="end">Realme RMX2161 · Helio G95 · LineageOS</text>
  </g>
</svg>
